<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Toddler Bubble Pop Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* On-screen Score / Level Indicator */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* Large Toddler-Friendly Bubbles */
        .bubble {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
            touch-action: manipulation;
            
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.25) 60%, rgba(255, 255, 255, 0.45) 100%);
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.9),
                        0 8px 18px rgba(0, 0, 0, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            
            animation: floatWobble 2.5s ease-in-out infinite alternate;
        }

        @keyframes floatWobble {
            0% { transform: translateX(-8px) rotate(-4deg); }
            100% { transform: translateX(8px) rotate(4deg); }
        }

        .bubble-text {
            font-weight: 900;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            text-align: center;
        }

        #start-btn {
            padding: 20px 50px;
            font-size: 28px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,114,255,0.4);
            transition: transform 0.2s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">🫧 Toddler Bubble Pop 🫧</h1>
        <p style="margin-bottom: 30px; opacity: 0.9;">Super gentle start! Pops speed up as you play.</p>
        <button id="start-btn">PLAY NOW</button>
    </div>

    <div id="hud">Pops: <span id="score">0</span> | Speed Level: <span id="level">1</span></div>
    <div id="game-area"></div>

    <script>
        const gameArea = document.getElementById('game-area');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');

        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const colors = [
            '#FF6B6B', '#4ECDC4', '#FFE66D', '#FF8B94', 
            '#A8E6CF', '#DCEDC1', '#FFD3B6', '#FFAAA5',
            '#9B5DE5', '#F15BB5', '#00BBF9', '#00F5D4'
        ];

        let audioCtx;
        const synth = window.speechSynthesis;

        // Dynamic Speed Tracking Variables
        let poppedCount = 0;
        let baseSpeed = 0.2; // Extremely slow start (~10–12 seconds to fall across the screen)
        let spawnIntervalTime = 1500; // 2.5 seconds between initial spawns
        let spawnTimeoutId = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBackgroundMusic();
        }

        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function startBackgroundMusic() {
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00];
            let noteIndex = 0;

            setInterval(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIndex % notes.length], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 700);
        }

        function speak(text) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.8;
            utterance.pitch = 1.2;
            synth.speak(utterance);
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');

            const textSpan = document.createElement('span');
            textSpan.classList.add('bubble-text');
            const char = characters.charAt(Math.floor(Math.random() * characters.length));
            textSpan.textContent = char;

            // Extra large sizes for toddlers (80px to 120px)
            const bubbleSize = Math.floor(Math.random() * 40) + 80;
            const textColor = colors[Math.floor(Math.random() * colors.length)];
            const maxX = window.innerWidth - bubbleSize;
            const startX = Math.max(10, Math.floor(Math.random() * maxX));

            bubble.style.width = `${bubbleSize}px`;
            bubble.style.height = `${bubbleSize}px`;
            bubble.style.left = `${startX}px`;
            bubble.style.top = `-${bubbleSize + 20}px`;

            textSpan.style.fontSize = `${bubbleSize * 0.55}px`;
            textSpan.style.color = textColor;
            bubble.appendChild(textSpan);

            gameArea.appendChild(bubble);

            let currentY = -(bubbleSize + 20);
            
            // Uses current base speed with slight random variation
            const speed = baseSpeed + (Math.random() * 0.05); 

            function fall() {
                if (!bubble.parentNode) return;

                currentY += speed;
                bubble.style.top = `${currentY}px`;

                if (currentY > window.innerHeight) {
                    bubble.remove();
                } else {
                    requestAnimationFrame(fall);
                }
            }

            requestAnimationFrame(fall);

            const handlePop = (e) => {
                e.preventDefault();
                playPopSound();
                speak(char);
                bubble.remove();

                // Increment score & increase speed smoothly every 5 pops
                poppedCount++;
                scoreEl.textContent = poppedCount;

                if (poppedCount % 5 === 0) {
                    baseSpeed = Math.min(baseSpeed + 0.08, 1.2); // Cap max speed
                    spawnIntervalTime = Math.max(spawnIntervalTime - 150, 900); // Cap min spawn delay
                    
                    const level = Math.floor(poppedCount / 5) + 1;
                    levelEl.textContent = level;
                }
            };

            bubble.addEventListener('touchstart', handlePop, { passive: false });
            bubble.addEventListener('mousedown', handlePop);
        }

        // Recursive Loop to dynamically adjust spawn timing
        function gameLoop() {
            createBubble();
            spawnTimeoutId = setTimeout(gameLoop, spawnIntervalTime);
        }

        startBtn.addEventListener('click', () => {
            startOverlay.style.display = 'none';
            initAudio();
            speak('');
            gameLoop();
        });
    </script>
</body>
</html>
